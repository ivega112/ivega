allowBuilds:
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  bufferutil: true
  esbuild: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

# Security patches for transitive deps pulled in by next/@vercel/blob that carry known
# CVEs at the versions those packages currently pin (found via `pnpm audit`, 2026-08-06):
# sharp <0.35.0 (libvips CVEs, used by next/image at request time), postcss <8.5.18
# (path traversal / XSS in sourceMappingURL handling — build-time only for this app, but
# patched anyway since it costs nothing), undici <6.28.0 (only exercised if
# STORAGE_PROVIDER=vercel-blob is actually configured).
overrides:
  sharp: '>=0.35.0'
  postcss: '>=8.5.18'
  undici: '>=6.28.0'
